<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遊戲街 · 聯絡我們</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <div class="logo">🎮 遊戲街</div>
      <ul class="nav-links">
        <li><a href="index.html">首頁</a></li>
        <li><a href="products.html">介紹</a></li>
        <li><a href="contact.html" class="active">聯絡我們</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="contact-info">
      <h1>聯絡我們</h1>
      <div class="info-block">
        <p><strong>地址：</strong>香港九龍旺角遊戲街 100 號</p>
        <p><strong>電話：</strong>+852 1234 5678</p>
        <p><strong>電子郵件：</strong><a href="mailto:20251103@blwc.edu.hk">20251103@blwc.edu.hk</a></p>
        <p><strong>營業時間：</strong>星期一至日 上午 11:00 – 晚上 10:00</p>
      </div>
    </section>

    <section class="contact-form-section">
      <h2>發送訊息</h2>
      <form id="contactForm">
        <div class="form-group">
          <label for="name">姓名：</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">電子郵件：</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">訊息：</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        <button type="submit" class="btn-submit">送出訊息</button>
        <div id="formFeedback" class="form-feedback"></div>
      </form>
    </section>
  </main>

  <footer>
    <p>© 2025 遊戲街 · 香港九龍旺角遊戲街 100 號 · 電話 +852 1234 5678</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
